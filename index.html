function buildReportCard(topicStats) {
  const ADVICE = {
    comparison: {
      bad:  '原級・比較級・最上級の「型」がまだ定着していません。Lesson 21〜23の解説を開き、〈as＋原級＋as〉〈比較級＋than〉〈the＋最上級＋in/of〉の3つを例文ごと音読しましょう。そのあと〈the＋比較級…, the＋比較級…〉、no more/no less than、倍数表現（twice as…as）の順に進むと効率的です。',
      mid:  '基本はできています。ミスが出やすいのは、no more than / not more than の使い分け、比較級の強調（veryではなくmuch/far）、倍数表現の語順です。Lesson 23の「noを使った比較表現」を重点的に見直しましょう。',
      good: '比較は得意分野です。余裕があれば、No構文や than any other を使った「最上級の書き換え」を英作文で練習すると、さらに強くなります。'
    },
    relative: {
      bad:  '関係詞は、次の3段階で整理すると解けるようになります。①先行詞が人か物か、②関係詞節の中で主語・目的語・所有格のどれの働きか（who/which/whose）、③what（先行詞を含む）と関係副詞（where/when/why/how）の区別。Lesson 24→25→26の順に復習しましょう。継続用法（コンマあり）ではthatが使えない点も要チェックです。',
      mid:  'あと一歩です。ミスが出やすいのは、whatと関係副詞の使い分け、「前置詞＋whom/which」の形、複合関係詞（whoever / whatever / however）の意味です。Lesson 25〜27の「ひとこと解説」を読み直し、書き換え（where＝前置詞＋which など）を練習しましょう。',
      good: '関係詞は得意分野です。次は、継続用法や as/than が関係代名詞として働く文など、Lesson 27の応用表現に挑戦してみましょう。'
    },
    conditional: {
      bad:  '仮定法は「時制のセット」を覚えるのが最優先です。①現在の事実の反対：If＋過去形（beはwere）, would＋原形。②過去の事実の反対：If＋had＋過去分詞, would have＋過去分詞。③混合型：if節は過去、主節は現在。ひねり問題の練習法は、日本語の事実文を「否定⇔肯定」に反転してからifで書き直すことです。Lesson 28を最初に復習しましょう。',
      mid:  '仮定法の形は理解できています。ミスが出やすいのは、had had の連続、否定形のif節（had not＋過去分詞）、混合仮定法、could/mightの使い分けです。Lesson 28Dと29の「ifの省略（倒置）」を確認しましょう。',
      good: '仮定法は得意分野です。さらに力をつけるなら、Lesson 30の but for / without / if it were not for や、ていねい表現（I was wondering if…）も英作文で使ってみましょう。'
    },
    vocab: {
      bad:  '単語の定着がこれからの課題です。まず間違えた単語を「単語」タブの検索で確認し、例文の中で覚え直しましょう。1日20語ずつ進め、翌日に前日分をクイズで確認する方法がおすすめです。品詞（名詞・形容詞・動詞）も一緒に覚えると、穴埋めで文脈から選びやすくなります。',
      mid:  'あと少しです。間違えた単語は「単語確認クイズ」で何度か出題し直しましょう。形が似た単語を混同していないかも確認してください。',
      good: '単語力は十分です。さらに伸ばすなら、各単語を使った自作の英文を書いてみましょう。'
    }
  };
  const LV = {good:'🟢 得意', mid:'🟡 もう少し', bad:'🔴 要復習'};

  const rows = ['comparison','relative','conditional','vocab']
    .map(k => {
      const t = topicStats[k];
      if (!t || t.total === 0) return null;
      const pct = Math.round(t.correct / t.total * 100);
      return {k, t, pct, lv: pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad'};
    })
    .filter(Boolean);
  if (rows.length === 0) return '';

  const sorted = [...rows].sort((a, b) => a.pct - b.pct);
  const weakest = sorted[0], strongest = sorted[sorted.length - 1];
  const overall = weakest.lv === 'good'
    ? '全分野で80%以上と、とても安定した成績です。この調子で応用問題にも挑戦しましょう。'
    : `最優先で復習したいのは <b>${weakest.t.label}</b>（${weakest.pct}%）です。` +
      (strongest.lv !== 'bad' && strongest !== weakest
        ? `一方、<b>${strongest.t.label}</b>（${strongest.pct}%）は得意分野です。` : '');

  const rowsHtml = rows.map(r => {
    let wrongHtml = '';
    if (r.t.wrong.length) {
      const items = r.k === 'vocab'
        ? r.t.wrong.map(w => {
            const v = VOCAB.find(x => x.en.toLowerCase() === String(w).toLowerCase());
            return v ? `${v.en}（${v.jp}）` : w;
          })
        : r.t.wrong.slice(0, 3);
      wrongHtml = `<div class="topic-wrong"><b>${r.k === 'vocab' ? '間違えた単語' : '間違えたポイント'}：</b><br>` +
        items.map(i => `・${i}`).join('<br>') + `</div>`;
    }
    return `<div class="topic-row">
      <div class="topic-head">
        <span class="topic-name">${r.t.label}</span>
        <span class="topic-pct ${r.lv}">${r.t.correct}/${r.t.total}（${r.pct}%）</span>
      </div>
      <div class="topic-bar-wrap"><div class="topic-bar ${r.lv}" style="width:${r.pct}%"></div></div>
      <div class="topic-advice"><b>${LV[r.lv]}</b>　${ADVICE[r.k][r.lv]}${wrongHtml}</div>
    </div>`;
  }).join('');

  return `<div class="report-card">
    <div class="report-title">📊 成績表｜分野別の得点とアドバイス</div>
    <div class="report-overall">${overall}</div>
    ${rowsHtml}
  </div>`;
}

// ================================================================
// 採点
// ================================================================
async function submitExam() {
  const es = examState, c = EXAM_CFG;
  if (es.submitted) return;
  es.submitted = true;

  const btn = document.querySelector('.exam-submit-btn');
  btn.disabled = true;
  btn.textContent = '🤖 採点中...';

  let total = 0;
  const breakdown = {vocab:0,mc:0,fill:0,sort:0,rewrite:0,trans:0};
  // 分野別の正答数・総数・間違えたポイント（比較・関係詞・仮定法・単語）
  const topicStats = {
    comparison: {correct:0, total:0, wrong:[], label:'比較（Lesson 21〜23）'},
    relative:   {correct:0, total:0, wrong:[], label:'関係詞（Lesson 24〜27）'},
    conditional:{correct:0, total:0, wrong:[], label:'仮定法（Lesson 28〜30）'},
    vocab:      {correct:0, total:0, wrong:[], label:'英単語（1001〜1300）'}
  };
  const recordTopic = (topic, ok, note) => {
    if (topic && topicStats[topic]) {
      topicStats[topic].total++;
      if (ok) topicStats[topic].correct++;
      else if (note && !topicStats[topic].wrong.includes(note)) topicStats[topic].wrong.push(note);
    }
  };
  const LET = ['A','B','C','D','E'];

  // ── Section 1：単語（1空所 pts 点）──
  es.vocabSets.forEach((s, si) => {
    let n = 0;
    s.answers.forEach((ans, i) => {
      const sel = document.getElementById(`evs-${si}-${i}`);
      const ok = !!sel && sel.value.toLowerCase() === ans.toLowerCase();
      if (sel) {
        sel.disabled = true;
        sel.style.background = ok ? '#e8f8ed' : '#fde8ec';
        sel.style.border = ok ? '2px solid #28a745' : '2px solid #dc3545';
      }
      if (ok) n++;
      recordTopic('vocab', ok, ans);
    });
    const pts = n * c.vocab.pts;
    total += pts; breakdown.vocab += pts;
    const fb = document.getElementById(`efb-vocab-${si}`);
    if (fb) {
      const num = w => s.words.findIndex(x => x.toLowerCase() === w.toLowerCase()) + 1;
      fb.className = `exam-fb ${n===s.answers.length?'ok':'ng'} vis`;
      fb.innerHTML = `${n}/${s.answers.length}空所正解（${pts}点）<br>正解：` +
        s.answers.map((a,i)=>`(${LET[i]}) ${num(a)}. ${a}`).join('　');
    }
  });

  // ── Section 2：四択 ──
  es.mcQs.forEach((q, i) => {
    const sel = es.answers.mc?.[i];
    const ok = sel === q.ans;
    const wrap = document.getElementById(`eq-mc-${i}`);
    if (wrap) {
      wrap.querySelectorAll('.exam-opt').forEach((b, k) => {
        b.disabled = true;
        if (k === q.ans) b.classList.add('ex-ok');
        else if (k === sel) b.classList.add('ex-ng');
      });
    }
    const fb = document.getElementById(`efb-mc-${i}`);
    if (fb) {
      fb.className = `exam-fb ${ok?'ok':'ng'} vis`;
      fb.innerHTML = `${ok?'✅ 正解':'❌ 不正解'}：${q.exp}${!ok?`<br>正解：${q.ans+1}. ${q.opts[q.ans]}`:''}`;
    }
    if (ok) { total += c.mc.pts; breakdown.mc += c.mc.pts; }
    recordTopic(q.topic, ok, q.exp);
  });

  // ── Section 3：カッコ補充（完答）──
  es.fillQs.forEach((q, i) => {
    let allOk = true;
    q.ans.forEach((alts, b) => {
      const el = document.getElementById(`e3-${i}-${b}`);
      if (!el) return;
      const ok = alts.some(a => normEn(el.value) === a.toLowerCase());
      el.classList.add(ok ? 'ex-ok' : 'ex-ng');
      el.disabled = true;
      if (!ok) allOk = false;
    });
    const fb = document.getElementById(`efb-fill-${i}`);
    if (fb) {
      let b = 0;
      const full = q.en.replace(/\{\}/g, () => `<b>${q.ans[b++][0]}</b>`);
      fb.className = `exam-fb ${allOk?'ok':'ng'} vis`;
      fb.innerHTML = `${allOk?'✅ 正解':'❌ 不正解（完答でないと得点になりません）'}：${q.exp}${!allOk?`<br>正解：${full}`:''}`;
    }
    if (allOk) { total += c.fill.pts; breakdown.fill += c.fill.pts; }
    recordTopic(q.topic, allOk, q.exp);
  });

  // ── Section 4：並べ替え ──
  es.sortQs.forEach((q, i) => {
    const chips = document.getElementById(`eslot-sort-${i}`)?.querySelectorAll('.exam-chip') || [];
    const user = normEn(Array.from(chips).map(x => x.dataset.word).join(' '));
    const ok = user === normEn(q.ans);
    chips.forEach(x => { x.classList.add('disabled'); x.disabled = true; });
    const fb = document.getElementById(`efb-sort-${i}`);
    if (fb) {
      fb.className = `exam-fb ${ok?'ok':'ng'} vis`;
      fb.innerHTML = `${ok?'✅ 正解':'❌ 不正解'}：${q.exp}${!ok?`<br>正解：${[q.pre,q.ans,q.post].filter(Boolean).join(' ').replace(/\s+([,.])/g,'$1')}`:''}`;
    }
    if (ok) { total += c.sort.pts; breakdown.sort += c.sort.pts; }
    recordTopic(q.topic, ok, q.exp);
  });

  // ── Section 5・6：AI採点 ──
  const rewriteItems = es.rewriteQs.map((q, i) => {
    const user = (q.model.map((_, b) => document.getElementById(`e5-${i}-${b}`)?.value?.trim() || ''));
    return {idx:i, kind:'rewrite', a:q.a, b:q.b, dir:q.dir,
      userAns: fillBlanks(q.b, user.map(u => u || '（空欄）')), rawUser: user,
      model: fillBlanks(q.b, q.model), exp:q.exp, topic:q.topic};
  });
  const transItems = es.transQs.map((q, i) => ({
    idx:i, kind:'trans', jp:q.jp, notes:q.notes.join('／'),
    userAns: document.getElementById(`e6-${i}`)?.value?.trim() || '（未回答）',
    model:q.model, exp:q.exp, topic:q.topic}));

  const [rewriteScores, transScores] = await Promise.all([
    aiGradeExam(rewriteItems, 'rewrite', c.rewrite.pts),
    aiGradeExam(transItems, 'trans', c.trans.pts)
  ]);

  const applyAI = (results, items, cat, maxPts, bdKey) => {
    results.forEach(r => {
      const it = items[r.idx];
      if (!it) return;
      const pts = Math.min(maxPts, Math.max(0, Math.round(r.score)));
      total += pts; breakdown[bdKey] += pts;
      const good = pts >= maxPts * 0.6;
      const fb = document.getElementById(`efb-${cat}-${r.idx}`);
      if (fb) {
        fb.className = `exam-fb ${good?'ok':'ng'} vis`;
        fb.innerHTML = `🤖 <strong>AI採点：${pts}/${maxPts}点</strong><br>
          📝 <strong>あなたの解答：</strong>${it.userAns}<br>
          ✅ <strong>模範解答：</strong>${it.model}<br>
          💡 <strong>ポイント：</strong>${it.exp}<br>
          💬 <strong>AIフィードバック：</strong>${r.feedback}`;
      }
      const lock = cat === 'rewrite'
        ? document.querySelectorAll(`#eq-rewrite-${r.idx} .exam-blank`)
        : [document.getElementById(`e6-${r.idx}`)];
      lock.forEach(el => { if (el) el.disabled = true; });
      recordTopic(it.topic, good, it.exp);
    });
  };
  applyAI(rewriteScores, rewriteItems, 'rewrite', c.rewrite.pts, 'rewrite');
  applyAI(transScores, transItems, 'trans', c.trans.pts, 'trans');

  document.getElementById('examProgBar').style.width = '100%';
  document.getElementById('examProgNum').textContent = `${total}点 / ${EXAM_MAX}点`;
  addXP(50);
  document.getElementById('examContent').scrollIntoView({behavior:'smooth'});

  // 結果サマリー（成績表付き）を先頭に追加
  const pct = Math.round(total / EXAM_MAX * 100);
  const emoji = pct>=80?'🏆':pct>=60?'😊':pct>=40?'💪':'📚';
  const msg = pct>=80?'優秀！素晴らしい成績です！':pct>=60?'よくできました！苦手な分野を復習しよう。':pct>=40?'もう少し！解説をしっかり読んで再挑戦しよう。':'解説を読んで基礎から復習しよう。';
  const mx = {
    vocab: c.vocab.sets*c.vocab.blanks*c.vocab.pts, mc: c.mc.n*c.mc.pts, fill: c.fill.n*c.fill.pts,
    sort: c.sort.n*c.sort.pts, rewrite: c.rewrite.n*c.rewrite.pts, trans: c.trans.n*c.trans.pts
  };
  const bd = (key, label, color) => `<div class="ex-bd"><div class="ex-bd-num" style="color:${color}">${breakdown[key]}/${mx[key]}</div><div class="ex-bd-lbl">${label}</div></div>`;

  const summary = document.createElement('div');
  summary.className = 'exam-result';
  summary.innerHTML = `
    <div class="exam-result-emoji">${emoji}</div>
    <div class="exam-result-score">${total}</div>
    <div class="exam-result-total">/ ${EXAM_MAX}点</div>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">${msg}</p>
    <div class="exam-breakdown">
      ${bd('vocab','Sec.1 単語','var(--indigo)')}
      ${bd('mc','Sec.2 四択','var(--indigo)')}
      ${bd('fill','Sec.3 カッコ補充','var(--green)')}
      ${bd('sort','Sec.4 並べ替え','#fd7e14')}
      ${bd('rewrite','Sec.5 書き換え🤖','#6b4c9e')}
      ${bd('trans','Sec.6 和文英訳🤖','var(--red)')}
    </div>
    ${buildReportCard(topicStats)}
    <button class="start-btn" style="margin-top:18px;" onclick="renderExamHome()">🔄 もう一度テストを受ける</button>`;
  document.getElementById('examContent').prepend(summary);
}

// ── AI採点（Section 5・6）。失敗時は模範解答との完全一致のみ得点 ──
async function aiGradeExam(items, kind, maxPts) {
  const isRewrite = (kind === 'rewrite');

  const rubric = isRewrite
    ? `Section 5「Aとほぼ同じ意味の文に書き換える（Bの空欄補充）」を採点します。
- 生徒がBの空欄に入れた語句で完成した文が、(1)指示（仮定法・比較級・関係代名詞・最上級など）に従い、(2)文法的に正しく、(3)Aとほぼ同じ意味になっていれば満点（${maxPts}点）。
- 模範解答と違う別表現（could do / would do、which / that など）でも、条件を満たせば満点にしてください。
- 空欄の一部だけが誤り、または小さな文法ミス（時制・冠詞・綴り）があれば満点から減点。
- 指示に従っていない、意味が違う、未回答は0点。`
    : `Section 6「和文英訳（注意書きの指示に従う）」を採点します。
- 文法・語法・意味がすべて正しく、注意書きの指示（使うべき構文・語）を満たしていれば満点（${maxPts}点）。
- 模範解答と違う別表現でも、条件を満たせば満点にしてください。
- 小さなミス（綴り・冠詞・三単現など）1つで満点から1点減点、文法ミスが複数あれば更に減点。
- 注意書きの指示を満たしていない場合は、文が正しくても大きく減点（満点の半分以下）。
- 意味が大きく違う、未回答は0点。`;

  const sys = `あなたは日本の高校英語の教師です。${rubric}

得点は0〜${maxPts}の整数で付けてください。各問題の見出しは「問題N」（Nは0始まり）です。返すJSONの"idx"にはそのNの数値をそのまま使い、入力と同じ数の結果をすべて返してください。
JSONのみを返してください（説明・コードブロック不要）：
{"results":[{"idx":0,"score":点数,"feedback":"日本語で1〜2文。満点なら良かった点を具体的に、減点なら何をどう直すかを具体的に"}]}`;

  const content = items.map(it => isRewrite
    ? `問題${it.idx}：\nA：${it.a}\nB（指示：${it.dir}）：${it.b}\n生徒の完成文：「${it.userAns}」\n模範解答の完成文：「${it.model}」`
    : `問題${it.idx}：\n日本文：${it.jp}\n注意書き：${it.notes}\n生徒の解答：「${it.userAns}」\n模範解答：「${it.model}」`
  ).join('\n\n');

  const fallback = () => items.map(it => {
    const same = normEn(it.userAns.replace(/[（）]/g,'')) === normEn(it.model);
    return {idx:it.idx, score: same ? maxPts : 0,
      feedback: 'AI採点に接続できなかったため、模範解答と完全に一致した場合のみ得点にしています。別の正しい表現でも0点になっている可能性があるので、模範解答と見比べて確認してください。'};
  });

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:2000, system: sys, messages:[{role:"user", content}]})
    });
    const data = await res.json();
    const text = (data.content||[]).map(x=>x.text||'').join('');
    const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
    let results = parsed.results;
    if (!Array.isArray(results)) return fallback();

    // idxの検証：期待どおりでなければ配列の順序で振り直す
    const returned = results.map(r => r.idx);
    if (!items.every(it => returned.includes(it.idx)) || results.length !== items.length) {
      results = results.map((r, i) => ({idx: items[i] ? items[i].idx : r.idx, score:r.score, feedback:r.feedback}));
    }
    // 不足分は個別にフォールバック
    const got = new Set(results.map(r => r.idx));
    fallback().forEach(f => { if (!got.has(f.idx)) results.push(f); });
    return results.map(r => ({...r, score: Number.isFinite(+r.score) ? +r.score : 0}));
  } catch(e) {
    return fallback();
  }
}
